<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario - Codédex Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #1a0a1f 0%, #2d1139 50%, #1a0a1f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace, monospace;
      overflow: hidden;
    }
    
    #gameContainer {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 
        0 0 0 4px #FF69B4,
        0 0 40px rgba(255, 105, 180, 0.5),
        0 0 80px rgba(255, 105, 180, 0.3),
        0 0 120px rgba(255, 20, 147, 0.2),
        inset 0 0 60px rgba(255, 105, 180, 0.1);
      animation: containerGlow 3s ease-in-out infinite;
    }
    
    @keyframes containerGlow {
      0%, 100% { 
        box-shadow: 
          0 0 0 4px #FF69B4,
          0 0 40px rgba(255, 105, 180, 0.5),
          0 0 80px rgba(255, 105, 180, 0.3),
          0 0 120px rgba(255, 20, 147, 0.2);
      }
      50% { 
        box-shadow: 
          0 0 0 4px #FF1493,
          0 0 60px rgba(255, 105, 180, 0.7),
          0 0 100px rgba(255, 105, 180, 0.5),
          0 0 150px rgba(255, 20, 147, 0.4);
      }
    }
    
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a0a1f 0%, #2d1139 50%, #1a0a1f 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    
    #loadingOverlay.hidden {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
    
    .loading-logo {
      font-size: 48px;
      color: #FF69B4;
      text-shadow: 
        0 0 20px #FF69B4,
        0 0 40px #FF1493,
        0 0 60px #FF69B4;
      margin-bottom: 40px;
      animation: logoFloat 2s ease-in-out infinite;
      letter-spacing: 4px;
    }
    
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .loading-bar-container {
      width: 400px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #FF69B4;
      box-shadow: 
        0 0 20px rgba(255, 105, 180, 0.5),
        inset 0 0 10px rgba(255, 105, 180, 0.2);
    }
    
    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #FF69B4, #FF1493, #FF69B4, #FF1493, #FF69B4);
      background-size: 200% 100%;
      animation: loadingShimmer 1.5s linear infinite;
      border-radius: 8px;
      transition: width 0.3s ease;
      box-shadow: 0 0 20px #FF69B4;
    }
    
    @keyframes loadingShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .loading-text {
      color: #FF69B4;
      font-size: 14px;
      margin-top: 20px;
      text-shadow: 0 0 10px #FF69B4;
      animation: textPulse 1s ease-in-out infinite;
    }
    
    @keyframes textPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    #controls {
      position: absolute;
      bottom: -45px;
      left: 0;
      right: 0;
      text-align: center;
      color: #FF69B4;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #FF69B4;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
    <div id="loadingOverlay">
      <div class="loading-logo">SUPER MARIO</div>
      <div class="loading-bar-container">
        <div class="loading-progress" id="loadingProgress"></div>
      </div>
      <div class="loading-text">LOADING ADVENTURE...</div>
    </div>
    <div id="controls">ARROWS/WASD: MOVE | SPACE: JUMP | R: RESTART | M: MUTE</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const loadingProgress = document.getElementById('loadingProgress');
    const loadingOverlay = document.getElementById('loadingOverlay');
    
    const TILE_SIZE = 32;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const MOVE_SPEED = 6;
    const FRICTION = 0.82;
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 640;
    
    const GameState = {
      LOADING: 'loading',
      TITLE: 'title',
      PLAYING: 'playing',
      PAUSED: 'paused',
      GAME_OVER: 'gameover',
      LEVEL_COMPLETE: 'levelcomplete',
      WORLD_COMPLETE: 'worldcomplete'
    };
    
    let gameState = GameState.LOADING;
    let currentLevel = 1;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('marioHighScoreCodedex')) || 0;
    let xp = 0;
    let levelXP = 0;
    let coins = 0;
    let lives = 3;
    let time = 400;
    let timerInterval = null;
    let cameraX = 0;
    let frameCount = 0;
    let screenShake = 0;
    let particles = [];
    let floatingTexts = [];
    let isMuted = false;
    let levelWidth = 3200;
    let titleAnimFrame = 0;
    let badges = JSON.parse(localStorage.getItem('marioBadges')) || {
      firstLevel: false,
      allLevels: false,
      coinMaster: false,
      speedRunner: false,
      noHit: false
    };
    
    const keys = { left: false, right: false, jump: false, jumpPressed: false };
    
    const COLORS = {
      primary: '#FF69B4',
      primaryDark: '#FF1493',
      primaryLight: '#FFB6C1',
      accent: '#00FFFF',
      accentDark: '#00CED1',
      
      sky1: '#1a0a1f', sky2: '#2d1139', sky3: '#3d1a4a',
      ground: '#FF69B4', brick: '#FF1493', brickLight: '#FFB6C1', brickDark: '#C71585',
      marioRed: '#FF4444', marioSkin: '#FFCC99', marioBrown: '#8B4513',
      goomba: '#FF69B4', goombaDark: '#FF1493',
      coin: '#FFD700', coinDark: '#FFA500',
      pipe: '#FF69B4', pipeDark: '#FF1493', pipeHighlight: '#FFB6C1',
      flagPole: '#00FF00', flagBall: '#FF69B4',
      questionBlock: '#FF69B4', questionDark: '#FF1493', questionHighlight: '#FFFFFF',
      cloud: '#FFFFFF', bush: '#FF69B4', bushDark: '#FF1493',
      castle: '#FF69B4', castleDark: '#FF1493', castleLight: '#FFB6C1',
      star: '#FFD700', starGlow: '#FFA500',
      powerup: '#00FFFF', powerupGlow: '#00CED1',
      mushBlue: '#00BFFF', mushRed: '#FF69B4',
      fire: '#FF4500', fireGlow: '#FF6347',
      neonGreen: '#39FF14',
      neonBlue: '#00FFFF',
      neonPurple: '#BF00FF'
    };
    
    const LEVEL_THEMES = {
      1: { sky: ['#1a0a1f', '#2d1139', '#3d1a4a'], ground: '#FF69B4', name: 'LEVEL 1-1', color: '#FF69B4' },
      2: { sky: ['#0a1a1f', '#113d2d', '#1a4a3d'], ground: '#00CED1', name: 'LEVEL 1-2', color: '#00CED1' },
      3: { sky: ['#1f1a0a', '#393d11', '#4a3d1a'], ground: '#FFD700', name: 'LEVEL 1-3', color: '#FFD700' },
      4: { sky: ['#1f0a1a', '#39112d', '#4a1a3d'], ground: '#FF1493', name: 'LEVEL 1-4', color: '#FF1493' }
    };
    
    class Particle {
      constructor(x, y, color, options = {}) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = options.vx || (Math.random() - 0.5) * 12;
        this.vy = options.vy || (Math.random() - 0.5) * 12 - 4;
        this.life = options.life || 50;
        this.maxLife = this.life;
        this.size = options.size || Math.random() * 10 + 4;
        this.gravity = options.gravity !== undefined ? options.gravity : 0.25;
        this.fade = options.fade !== undefined ? options.fade : true;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.4;
        this.type = options.type || 'square';
        this.trail = [];
      }
      
      update() {
        this.trail.push({ x: this.x, y: this.y, life: 10 });
        if (this.trail.length > 5) this.trail.shift();
        
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.97;
        this.life--;
        this.rotation += this.rotationSpeed;
        
        for (let t of this.trail) t.life--;
        
        return this.life <= 0;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const alpha = (t.life / 10) * 0.3;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(t.x - cameraX, t.y, this.size * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        
        const alpha = this.fade ? this.life / this.maxLife : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(screenX, this.y);
        ctx.rotate(this.rotation);
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        
        if (this.type === 'circle') {
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
          gradient.addColorStop(0, '#FFFFFF');
          gradient.addColorStop(0.5, this.color);
          gradient.addColorStop(1, this.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'star') {
          this.drawStar(0, 0, 5, this.size, this.size / 2, this.color);
        } else if (this.type === 'heart') {
          this.drawHeart(0, 0, this.size, this.color);
        } else {
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        }
        
        ctx.restore();
      }
      
      drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
        let rot = Math.PI / 2 * 3;
        let step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
          rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
      }
      
      drawHeart(x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y + size / 4);
        ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + size / 4);
        ctx.bezierCurveTo(x - size / 2, y + size / 2, x, y + size * 0.75, x, y + size);
        ctx.bezierCurveTo(x, y + size * 0.75, x + size / 2, y + size / 2, x + size / 2, y + size / 4);
        ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + size / 4);
        ctx.fill();
      }
    }
    
    class FloatingText {
      constructor(x, y, text, color = '#FFD700', size = 20) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 80;
        this.maxLife = 80;
        this.scale = 0;
        this.size = size;
        this.rotation = 0;
      }
      
      update() {
        this.y -= 1.2;
        this.life--;
        this.scale = Math.min(1, this.scale + 0.2);
        this.rotation += 0.05;
        return this.life <= 0;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
        
        const alpha = Math.min(1, this.life / 20);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(screenX, this.y);
        ctx.rotate(Math.sin(this.rotation) * 0.1);
        ctx.scale(this.scale, this.scale);
        
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.font = `bold ${this.size}px 'Press Start 2P', monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, 0, 0);
        
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }
    
    class Mario {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 32;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.facingRight = true;
        this.frame = 0;
        this.frameTimer = 0;
        this.state = 'small';
        this.invincible = false;
        this.invincibleTimer = 0;
        this.isJumping = false;
        this.isRunning = false;
        this.trailTimer = 0;
        this.maxJumps = 1;
        this.jumpsLeft = this.maxJumps;
        this.powerupPulse = 0;
      }
      
      update() {
        if (keys.left) {
          this.vx -= 0.9;
          this.facingRight = false;
          this.isRunning = true;
        } else if (keys.right) {
          this.vx += 0.9;
          this.facingRight = true;
          this.isRunning = true;
        } else {
          this.isRunning = false;
        }
        
        this.vx *= FRICTION;
        this.vx = Math.max(-MOVE_SPEED, Math.min(MOVE_SPEED, this.vx));
        if (Math.abs(this.vx) < 0.1) this.vx = 0;
        
        if (keys.jump && !keys.jumpPressed && this.jumpsLeft > 0) {
          this.vy = JUMP_FORCE;
          this.jumpsLeft--;
          this.isJumping = true;
          keys.jumpPressed = true;
          playSound('jump');
          this.createJumpParticles();
        }
        
        if (!keys.jump) {
          keys.jumpPressed = false;
          if (this.vy < -5) this.vy = -5;
        }
        
        if (this.onGround) {
          this.jumpsLeft = this.maxJumps;
          this.isJumping = false;
        }
        
        this.vy += GRAVITY;
        this.vy = Math.min(18, this.vy);
        
        this.x += this.vx;
        this.y += this.vy;
        
        if (this.x < 0) this.x = 0;
        if (this.x > levelWidth - this.width) this.x = levelWidth - this.width;
        if (this.y > 700) this.die();
        
        this.frameTimer++;
        if (this.frameTimer > 5) {
          this.frameTimer = 0;
          this.frame = (this.frame + 1) % 4;
        }
        
        if (this.invincible) {
          this.invincibleTimer--;
          if (this.invincibleTimer <= 0) this.invincible = false;
        }
        
        this.powerupPulse += 0.15;
        this.onGround = false;
      }
      
      createJumpParticles() {
        for (let i = 0; i < 12; i++) {
          particles.push(new Particle(
            this.x + this.width / 2,
            this.y + this.height,
            i % 2 === 0 ? COLORS.primary : COLORS.accent,
            { vx: (Math.random() - 0.5) * 8, vy: Math.random() * -4, size: Math.random() * 6 + 3, type: 'circle' }
          ));
        }
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        if (this.invincible && frameCount % 4 < 2) return;
        
        ctx.save();
        
        let drawX = screenX;
        if (!this.facingRight) {
          ctx.translate(screenX + this.width, 0);
          ctx.scale(-1, 1);
          drawX = 0;
        }
        
        if (this.state === 'fire') {
          this.drawFireAura(drawX);
        } else if (this.state === 'big') {
          this.drawPowerAura(drawX, COLORS.neonGreen);
        }
        
        if (this.isJumping) {
          this.drawJumpingMario(drawX);
        } else if (this.isRunning && Math.abs(this.vx) > 1) {
          this.drawRunningMario(drawX);
        } else {
          this.drawIdleMario(drawX);
        }
        
        ctx.restore();
      }
      
      drawIdleMario(x) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.marioRed;
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 8, this.y + 2, 12, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 6, this.y, 16, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, this.y + 2, 3, 3);
        ctx.fillRect(x + 18, this.y + 2, 3, 3);
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 10, this.y + 6, 8, 2);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 6, this.y + 10, 16, 10);
        
        ctx.fillStyle = '#FFEB3B';
        ctx.fillRect(x + 8, this.y + 12, 12, 6);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 4, this.y + 18, 8, 14);
        ctx.fillRect(x + 16, this.y + 18, 8, 14);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 2, this.y + 18, 4, 8);
        ctx.fillRect(x + 22, this.y + 18, 4, 8);
        
        if (this.state !== 'small') {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 4, this.y + 18, 8, 4);
          ctx.fillRect(x + 16, this.y + 18, 8, 4);
        }
      }
      
      drawRunningMario(x) {
        const frameOffset = this.frame % 2 === 0 ? 0 : 3;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.marioRed;
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 8, this.y + 2 - frameOffset, 12, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 6, this.y - frameOffset, 16, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, this.y + 2 - frameOffset, 3, 3);
        ctx.fillRect(x + 18, this.y + 2 - frameOffset, 3, 3);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 6, this.y + 10 - frameOffset, 16, 10);
        
        ctx.fillStyle = '#FFEB3B';
        ctx.fillRect(x + 8, this.y + 12 - frameOffset, 12, 6);
        
        if (this.frame === 0) {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 2, this.y + 18, 8, 10);
          ctx.fillRect(x + 18, this.y + 22, 8, 10);
          ctx.fillStyle = COLORS.marioBrown;
          ctx.fillRect(x + 4, this.y + 26, 4, 6);
          ctx.fillRect(x + 20, this.y + 30, 4, 4);
        } else if (this.frame === 1) {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 4, this.y + 20, 8, 12);
          ctx.fillRect(x + 16, this.y + 20, 8, 12);
          ctx.fillStyle = COLORS.marioBrown;
          ctx.fillRect(x + 6, this.y + 30, 4, 4);
          ctx.fillRect(x + 18, this.y + 30, 4, 4);
        } else {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 6, this.y + 18, 8, 10);
          ctx.fillRect(x + 14, this.y + 18, 8, 10);
          ctx.fillStyle = COLORS.marioBrown;
          ctx.fillRect(x + 2, this.y + 26, 4, 6);
          ctx.fillRect(x + 22, this.y + 26, 4, 6);
        }
        
        if (this.state !== 'small') {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 4, this.y + 18, 8, 4);
          ctx.fillRect(x + 16, this.y + 18, 8, 4);
        }
      }
      
      drawJumpingMario(x) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = COLORS.marioRed;
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 8, this.y + 2, 12, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 6, this.y, 16, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, this.y + 2, 3, 3);
        ctx.fillRect(x + 18, this.y + 2, 3, 3);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 6, this.y + 10, 16, 10);
        
        ctx.fillStyle = '#FFEB3B';
        ctx.fillRect(x + 8, this.y + 12, 12, 6);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 2, this.y + 18, 8, 8);
        ctx.fillRect(x + 18, this.y + 18, 8, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 0, this.y + 20, 4, 8);
        ctx.fillRect(x + 24, this.y + 20, 4, 8);
        
        if (this.state !== 'small') {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 2, this.y + 18, 8, 4);
          ctx.fillRect(x + 18, this.y + 18, 8, 4);
        }
      }
      
      drawFireAura(x) {
        const pulse = Math.sin(this.powerupPulse) * 5;
        const gradient = ctx.createRadialGradient(
          x + this.width / 2, this.y + this.height / 2, 5,
          x + this.width / 2, this.y + this.height / 2, 50 + pulse
        );
        gradient.addColorStop(0, 'rgba(255, 100, 0, 0.4)');
        gradient.addColorStop(0.5, 'rgba(255, 50, 0, 0.2)');
        gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x + this.width / 2, this.y + this.height / 2, 50 + pulse, 0, Math.PI * 2);
        ctx.fill();
      }
      
      drawPowerAura(x, color) {
        const pulse = Math.sin(this.powerupPulse) * 8;
        const gradient = ctx.createRadialGradient(
          x + this.width / 2, this.y + this.height / 2, 5,
          x + this.width / 2, this.y + this.height / 2, 45 + pulse
        );
        gradient.addColorStop(0, color + '60');
        gradient.addColorStop(0.7, color + '20');
        gradient.addColorStop(1, 'transparent');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x + this.width / 2, this.y + this.height / 2, 45 + pulse, 0, Math.PI * 2);

      hit() {
        if (this.invincible) return;
        
        if (this.state === 'small') {
          this.die();
        } else {
          this.state = 'small';
          this.height = 32;
          this.invincible = true;
          this.invincibleTimer = 120;
          playSound('shrink');
          screenShake = 15;
          createParticles(this.x + this.width/2, this.y + this.height/2, COLORS.primary, 15);

      powerUp(type) {
        if (type === 'mushroom') {
          this.state = 'big';
          this.height = 48;
        } else if (type === 'fireflower') {
          this.state = 'fire';
          this.height = 48;
        } else if (type === 'star') {

    class Goomba {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.vx = -1.5;
        this.alive = true;
        this.deadTimer = 0;
        this.squish = false;
        this.walkFrame = 0;
        this.walkTimer = 0;
        this.floatOffset = Math.random() * Math.PI * 2;
      }
      
      update() {
        if (this.squish) {
          this.deadTimer++;
          return this.deadTimer > 45;
        }
        
        if (this.x < cameraX - 150 || this.x > cameraX + CANVAS_WIDTH + 150) return false;
        
        this.x += this.vx;
        this.walkTimer++;
        if (this.walkTimer > 8) {
          this.walkTimer = 0;
          this.walkFrame = (this.walkFrame + 1) % 2;
        }
        
        for (const platform of platforms) {
          if (this.checkCollision(platform)) {
            this.x -= this.vx;
            this.vx *= -1;
          }
        }
        
        return false;
      }
      
      checkCollision(rect) {
        return this.x < rect.x + rect.width &&
               this.x + this.width > rect.x &&
               this.y < rect.y + rect.height &&
               this.y + this.height > rect.y;
      }
      
      stomp() {
        this.squish = true;
        this.vx = 0;
        score += 100;
        xp += 10;
        levelXP += 10;
        playSound('stomp');
        createParticles(this.x + this.width / 2, this.y + this.height / 2, COLORS.primary, 12);
        floatingTexts.push(new FloatingText(this.x, this.y, '+100'));
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        const floatY = Math.sin(frameCount * 0.1 + this.floatOffset) * 2;
        
        if (this.squish) {
          ctx.shadowBlur = 10;
          ctx.shadowColor = COLORS.primaryDark;
          ctx.fillStyle = COLORS.primaryDark;
          ctx.fillRect(screenX + 5, this.y + 22, 20, 8);
          return;
        }
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.primary;
        
        ctx.fillStyle = COLORS.primary;
        ctx.beginPath();
        ctx.arc(screenX + 15, this.y + 12 + floatY, 13, Math.PI, 0, false);
        ctx.fill();
        
        ctx.fillRect(screenX + 2, this.y + 12 + floatY, 26, 12);
        
        ctx.fillStyle = '#FFF';
        ctx.fillRect(screenX + 5, this.y + 6 + floatY, 6, 8);
        ctx.fillRect(screenX + 19, this.y + 6 + floatY, 6, 8);
        
        ctx.fillStyle = '#000';
        ctx.fillRect(screenX + 7, this.y + 8 + floatY, 2, 4);
        ctx.fillRect(screenX + 21, this.y + 8 + floatY, 2, 4);
        
        const footOffset = this.walkFrame === 0 ? 0 : 3;
        ctx.fillStyle = COLORS.primaryDark;
        ctx.fillRect(screenX + 2, this.y + 20 + floatY + footOffset, 6, 10 - footOffset);
        ctx.fillRect(screenX + 22, this.y + 20 + floatY + (3 - footOffset), 6, 10 - (3 - footOffset));

    class Koopa {
      constructor(x, y) {

        this.y = y;
        this.width = 28;
        this.height = 36;
        this.vx = -1;
        this.alive = true;
        this.squish = false;
        this.shell = false;
        this.shellMoving = false;
        this.facingRight = false;
        this.floatOffset = Math.random() * Math.PI * 2;
      }
      
      update() {
        if (this.squish) return false;
        if (this.shell && !this.shellMoving) return false;
        if (!this.shell || this.shellMoving) this.x += this.vx;
        if (this.x < cameraX - 150 || this.x > cameraX + CANVAS_WIDTH + 150) return false;
        
        for (const platform of platforms) {
          if (this.checkCollision(platform)) {
            this.x -= this.vx;
            this.vx *= -1;
            this.facingRight = this.vx > 0;
          }
        }
        
        return false;
      }
      
      checkCollision(rect) {
        return this.x < rect.x + rect.width &&
               this.x + this.width > rect.x &&
               this.y < rect.y + rect.height &&
               this.y + this.height > rect.y;
      }
      
      stomp() {
        if (this.shell && !this.shellMoving) {
          this.shellMoving = true;
          this.vx = mario.facingRight ? 8 : -8;
          playSound('kick');
        } else if (this.shell) {
          this.shellMoving = false;
          this.vx = 0;
        } else {
          this.shell = true;
          this.height = 20;
          this.vx = 0;
          playSound('stomp');
        }
        score += 100;
        xp += 10;
        levelXP += 10;
        createParticles(this.x + this.width / 2, this.y + this.height / 2, COLORS.neonGreen, 10);

        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.neonGreen;
        
        if (this.shell) {
          ctx.fillStyle = COLORS.neonGreen;
          ctx.beginPath();
          ctx.ellipse(screenX + 14, this.y + 10 + floatY, 12, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.ellipse(screenX + 14, this.y + 10 + floatY, 5, 4, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = COLORS.neonGreen;
          ctx.beginPath();
          ctx.arc(screenX + 14, this.y + 10 + floatY, 12, Math.PI, 0, false);
          ctx.fill();
          
          ctx.fillRect(screenX + 2, this.y + 10 + floatY, 24, 16);
          
          ctx.fillStyle = '#FFF';
          ctx.beginPath();
          ctx.arc(screenX + 6, this.y + 14 + floatY, 4, 0, Math.PI * 2);
          ctx.arc(screenX + 22, this.y + 14 + floatY, 4, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(screenX + 6, this.y + 14 + floatY, 2, 0, Math.PI * 2);
          ctx.arc(screenX + 22, this.y + 14 + floatY, 2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = COLORS.neonGreen;
          ctx.fillRect(screenX + 2, this.y + 24 + floatY, 6, 12);

        ctx.restore();

    class PowerUp {
      constructor(x, y, type = 'mushroom') {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 28;
        this.vx = type === 'mushroom' ? 2 : 3.5;
        this.vy = 0;
        this.type = type;
        this.emergeY = y;
        this.emerging = true;
        this.active = false;
        this.floatOffset = Math.random() * Math.PI * 2;
        this.rotation = 0;
      }
      
      update() {
        if (this.emerging) {
          this.y -= 1.5;
          if (this.y <= this.emergeY - TILE_SIZE) {
            this.emerging = false;
            this.active = true;
          }
          return false;
        }
        
        this.rotation += this.type === 'star' ? 0.15 : 0.05;
        this.vy += GRAVITY;
        this.y += this.vy;
        this.x += this.vx;
        
        for (const platform of platforms) {
          if (this.checkCollision(platform) && this.vy >= 0) {
            this.y = platform.y - this.height;
            this.vy = 0;
          }
        }
        
        if (this.x < cameraX - 100 || this.x > cameraX + CANVAS_WIDTH + 100) return false;
        if (this.x < 0) this.x = 0;
        if (this.x > levelWidth - this.width) {
          this.x = levelWidth - this.width;
          this.vx *= -1;
        }
        
        return false;
      }
      
      checkCollision(rect) {
        return this.x < rect.x + rect.width &&
               this.x + this.width > rect.x &&
               this.y < rect.y + rect.height &&
               this.y + this.height > rect.y;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        const floatY = Math.sin(frameCount * 0.1 + this.floatOffset) * 3;
        
        ctx.save();
        ctx.translate(screenX + 14, this.y + 14 + floatY);
        
        if (this.type === 'star') {
          ctx.rotate(this.rotation);
          ctx.shadowBlur = 35;
          ctx.shadowColor = COLORS.star;
          
          const pulse = Math.sin(frameCount * 0.3) * 3;
          
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 16 + pulse);
          gradient.addColorStop(0, '#FFFFFF');
          gradient.addColorStop(0.4, COLORS.star);
          gradient.addColorStop(1, '#FFA500');
          
          ctx.fillStyle = gradient;
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
            const r = i % 2 === 0 ? 14 + pulse : 6;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
        } else if (this.type === 'fireflower') {
          ctx.rotate(this.rotation);
          ctx.shadowBlur = 30;
          ctx.shadowColor = COLORS.fire;
          
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2 + frameCount * 0.08;
            const petalX = Math.cos(angle) * (10 + Math.sin(frameCount * 0.2) * 3);
            const petalY = Math.sin(angle) * (10 + Math.sin(frameCount * 0.2) * 3);
            
            const gradient = ctx.createRadialGradient(petalX, petalY, 0, petalX, petalY, 8);
            gradient.addColorStop(0, '#FFFF00');
            gradient.addColorStop(0.5, '#FF6B00');
            gradient.addColorStop(1, '#FF4500');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(petalX, petalY, 7, 0, Math.PI * 2);
            ctx.fill();
          }
          
          ctx.fillStyle = '#8B0000';
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.shadowBlur = 25;
          ctx.shadowColor = COLORS.mushRed;
          
          const gradient = ctx.createRadialGradient(-4, -4, 0, 0, 0, 16);
          gradient.addColorStop(0, '#FFFFFF');
          gradient.addColorStop(0.3, COLORS.mushRed);
          gradient.addColorStop(1, '#CC0033');
          
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, -4, 12, Math.PI, 0, false);
          ctx.fill();
          
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(-5, -6, 4, 0, Math.PI * 2);
          ctx.arc(5, -6, 4, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = COLORS.mushRed;
          ctx.fillRect(-7, 4, 14, 12);
          
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(-4, 8, 8, 8);
        }
        
        ctx.restore();
      }
    }
    
    class Platform {
      constructor(x, y, width, height, type = 'brick') {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.type = type;
        this.hitAnim = 0;
        this.glowPulse = Math.random() * Math.PI * 2;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
        
        const theme = LEVEL_THEMES[currentLevel] || LEVEL_THEMES[1];
        const glow = Math.sin(frameCount * 0.05 + this.glowPulse) * 0.2 + 0.8;
        
        if (this.type === 'pipe') {
          this.drawPipe(screenX, theme, glow);
        } else if (this.type === 'ground') {
          this.drawGround(screenX, theme, glow);
        } else if (this.type === 'question') {
          this.drawQuestionBlock(screenX, glow);
        } else if (this.type === 'brick') {
          this.drawBrick(screenX, glow);
        } else if (this.type === 'stone') {
          this.drawStone(screenX, glow);
        }
      }
      
      drawPipe(screenX, theme, glow) {
        const topWidth = TILE_SIZE * 2.5;
        const lipHeight = TILE_SIZE / 2;
        
        ctx.shadowBlur = 20 * glow;
        ctx.shadowColor = theme.color;
        
        ctx.fillStyle = theme.color + 'CC';
        ctx.fillRect(screenX - 8, this.y, topWidth + 16, lipHeight);
        
        ctx.fillStyle = theme.color;
        ctx.fillRect(screenX, this.y + lipHeight, topWidth, this.height);
        
        ctx.fillStyle = '#FFFFFF40';
        ctx.fillRect(screenX + 8, this.y + lipHeight, 8, this.height);
      }
      
      drawGround(screenX, theme, glow) {
        ctx.shadowBlur = 15 * glow;
        ctx.shadowColor = theme.color;
        
        const gradient = ctx.createLinearGradient(screenX, this.y, screenX, this.y + this.height);
        gradient.addColorStop(0, theme.color);
        gradient.addColorStop(1, theme.color + 'AA');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = '#FFFFFF30';
        for (let x = 0; x < this.width; x += TILE_SIZE) {
          ctx.fillRect(screenX + x + 2, this.y + 2, TILE_SIZE - 4, 4);
        }
        
        ctx.fillStyle = theme.color;
        ctx.fillRect(screenX, this.y, this.width, 4);
      }
      
      drawQuestionBlock(screenX, glow) {
        const bounce = this.hitAnim > 0 ? Math.sin(this.hitAnim * 0.5) * 4 : 0;
        
        ctx.save();
        ctx.translate(0, bounce);
        
        ctx.shadowBlur = 25 * glow;
        ctx.shadowColor = COLORS.primary;
        
        const gradient = ctx.createLinearGradient(screenX, this.y, screenX, this.y + this.height);
        gradient.addColorStop(0, COLORS.primaryLight);
        gradient.addColorStop(0.5, COLORS.primary);
        gradient.addColorStop(1, COLORS.primaryDark);
        
        ctx.fillStyle = gradient;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = '#FFFFFF40';
        ctx.fillRect(screenX + 2, this.y + 2, this.width - 4, 4);
        
        ctx.fillStyle = '#00000060';
        ctx.fillRect(screenX, this.y, this.width, 3);
        ctx.fillRect(screenX, this.y + this.height - 3, this.width, 3);
        ctx.fillRect(screenX, this.y, 3, this.height);
        ctx.fillRect(screenX + this.width - 3, this.y, 3, this.height);
        
        const pulseScale = 1 + Math.sin(frameCount * 0.1) * 0.1;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `bold ${Math.floor(18 * pulseScale)}px 'Press Start 2P', monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('?', screenX + this.width / 2, this.y + this.height / 2 + 7);
        
        ctx.restore();
        
        if (this.hitAnim > 0) this.hitAnim--;
      }
      
      drawBrick(screenX, glow) {
        ctx.shadowBlur = 10 * glow;
        ctx.shadowColor = COLORS.primaryDark;
        
        ctx.fillStyle = COLORS.primaryDark;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = COLORS.primary;
        ctx.fillRect(screenX + 2, this.y + 2, this.width - 4, this.height - 4);
        
        ctx.fillStyle = '#FFFFFF40';
        ctx.fillRect(screenX + 2, this.y + 2, this.width - 4, 4);
        
        ctx.strokeStyle = COLORS.primaryDark;
        ctx.lineWidth = 2;
        ctx.strokeRect(screenX + 1, this.y + 1, this.width - 2, this.height - 2);
      }
      
      drawStone(screenX, glow) {
        ctx.shadowBlur = 8 * glow;
        ctx.shadowColor = '#888';
        
        ctx.fillStyle = '#606060';
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = '#808080';
        ctx.fillRect(screenX + 2, this.y + 2, this.width - 4, 4);
      }
    }
    
    class FlagPole {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 20;
        this.height = 320;
      }
      
      draw() {

        ctx.shadowBlur = 40;

        ctx.beginPath();

    class Castle {

        ctx.fillRect(screenX + 35, this.y + 10, 90, 15);

        ctx.arc(screenX + 80, this.y + 120, 25, Math.PI, 0, false);

        ctx.fillStyle = COLORS.primaryDark;
        ctx.beginPath();
        ctx.arc(screenX + 80, this.y + 120, 20, Math.PI, 0, false);
        ctx.fill();
        
        ctx.shadowBlur = 0;
      }
    }
    
    class MovingPlatform {
      constructor(x, y, width, height, moveX, moveY, speed = 2) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.moveX = moveX;
        this.moveY = moveY;
        this.speed = speed;
        this.progress = 0;
        this.forward = true;
        this.glowPulse = Math.random() * Math.PI * 2;
      }
      
      update() {
        if (this.forward) {
          this.progress += this.speed / 100;
          if (this.progress >= 1) { this.progress = 1; this.forward = false; }
        } else {
          this.progress -= this.speed / 100;
          if (this.progress <= 0) { this.progress = 0; this.forward = true; }
        }
        
        this.x = this.startX + this.moveX * this.progress;
        this.y = this.startY + this.moveY * this.progress;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
        
        const glow = Math.sin(frameCount * 0.08 + this.glowPulse) * 5 + 15;
        
        ctx.shadowBlur = glow;
        ctx.shadowColor = COLORS.accent;
        
        ctx.fillStyle = COLORS.primaryDark;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = COLORS.accent;
        ctx.fillRect(screenX, this.y, this.width, 6);
        
        ctx.fillStyle = '#FFFFFF40';
        ctx.fillRect(screenX + 4, this.y + 8, this.width - 8, 4);
      }
    }

    function checkPlatformCollision(entity, platform) {
      const wasAbove = entity.y + entity.height - entity.vy <= platform.y + 5;
      const isOverlapping = entity.x < platform.x + platform.width &&
                            entity.x + entity.width > platform.x &&
                            entity.y < platform.y + platform.height &&
                            entity.y + entity.height > platform.y;
      
      if (isOverlapping && wasAbove && entity.vy >= 0) {
        entity.y = platform.y - entity.height;
        entity.vy = 0;
        entity.onGround = true;
        return true;
      }
      return false;
    }
    
    let audioCtx = null;
    
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    function playSound(type) {
      if (!audioCtx || isMuted) return;
      
      try {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        switch(type) {
          case 'jump':
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(900, now + 0.1);
            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            oscillator.start(now);
            oscillator.stop(now + 0.15);
            break;
            
          case 'coin':
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(988, now);
            oscillator.frequency.setValueAtTime(1319, now + 0.06);
            oscillator.frequency.setValueAtTime(1760, now + 0.12);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            oscillator.start(now);
            oscillator.stop(now + 0.25);
            break;
            
          case 'stomp':
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(350, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.12);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            oscillator.start(now);
            oscillator.stop(now + 0.12);
            break;
            
          case 'kick':
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(200, now);
            oscillator.frequency.exponentialRampToValueAtTime(60, now + 0.18);
            gainNode.gain.setValueAtTime(0.18, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            oscillator.start(now);
            oscillator.stop(now + 0.18);
            break;
            
          case 'powerup':
            const notes = [523, 659, 784, 1047];
            notes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.1);
              gain.gain.setValueAtTime(0.12, now + i * 0.1);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.15);
            });
            break;
            
          case 'shrink':
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(500, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.35);
            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            oscillator.start(now);
            oscillator.stop(now + 0.35);
            break;
            
          case 'death':
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(500, now);
            oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.9);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
            oscillator.start(now);
            oscillator.stop(now + 0.9);
            break;
            
          case 'levelcomplete':
            const melody = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
            melody.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, now + i * 0.12);
              gain.gain.setValueAtTime(0.1, now + i * 0.12);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
              osc.start(now + i * 0.12);
              osc.stop(now + i * 0.12 + 0.2);
            });
            break;
        }
      } catch(e) {}
    }
    
    function drawBackground() {
      const theme = LEVEL_THEMES[currentLevel] || LEVEL_THEMES[1];
      
      const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      gradient.addColorStop(0, theme.sky[0]);
      gradient.addColorStop(0.5, theme.sky[1]);
      gradient.addColorStop(1, theme.sky[2]);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      for (const mountain of mountains) {
        const screenX = mountain.x - cameraX * 0.1;
        if (screenX < -200 || screenX > CANVAS_WIDTH + 200) continue;
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = theme.sky[2];
        
        ctx.fillStyle = theme.sky[2] + '80';
        ctx.beginPath();
        ctx.moveTo(screenX - 100 * mountain.size, 576);
        ctx.lineTo(screenX, 576 - 200 * mountain.size);
        ctx.lineTo(screenX + 100 * mountain.size, 576);
        ctx.closePath();
        ctx.fill();
      }
      
      for (const hill of hills) {
        const screenX = hill.x - cameraX * 0.3;
        if (screenX < -150 || screenX > CANVAS_WIDTH + 150) continue;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = theme.color + '60';
        
        ctx.fillStyle = theme.color + '40';
        ctx.beginPath();
        ctx.arc(screenX, 576, 80 * hill.size, Math.PI, 0, false);
        ctx.fill();
        
        ctx.fillStyle = theme.color + '60';
        ctx.beginPath();
        ctx.arc(screenX, 576, 60 * hill.size, Math.PI, 0, false);
        ctx.fill();
      }
      
      for (const cloud of clouds) {
        const screenX = cloud.x - cameraX * 0.2;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) continue;
        
        ctx.save();
        ctx.globalAlpha = 0.7 + Math.sin(frameCount * 0.05) * 0.2;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#FFFFFF40';
        
        ctx.fillStyle = '#FFFFFF';
        ctx.translate(screenX, cloud.y);
        ctx.scale(cloud.size, cloud.size);
        
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.arc(35, -8, 35, 0, Math.PI * 2);
        ctx.arc(70, 0, 25, 0, Math.PI * 2);
        ctx.arc(20, 12, 22, 0, Math.PI * 2);
        ctx.arc(50, 12, 22, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
      
      ctx.fillStyle = theme.ground;
      for (const bush of bushes) {
        const screenX = bush.x - cameraX * 0.5;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) continue;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = theme.color + '60';
        
        ctx.fillStyle = theme.color + '80';
        ctx.beginPath();
        ctx.arc(screenX, 550, 55 * bush.size, Math.PI, 0, false);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(screenX + 50, 550, 45 * bush.size, Math.PI, 0, false);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(screenX + 90, 550, 50 * bush.size, Math.PI, 0, false);
        ctx.fill();
      }
      
      ctx.shadowBlur = 0;
    }

    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        if (gameState === GameState.PLAYING) {
          time--;
          if (time <= 0) {
            time = 0;
            mario.die();
          }
        }
      }, 1000);
    }
    
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    function update() {
      frameCount++;
      titleAnimFrame++;
      
      if (screenShake > 0) screenShake--;
      
      if (gameState !== GameState.PLAYING) return;
      
      mario.update();
      
      const targetCameraX = mario.x - CANVAS_WIDTH / 3;
      cameraX += (targetCameraX - cameraX) * 0.12;
      cameraX = Math.max(0, Math.min(levelWidth - CANVAS_WIDTH, cameraX));
      
      for (const platform of platforms) {
        checkPlatformCollision(mario, platform);
      }
      
      for (const mp of movingPlatforms) {
        mp.update();
        checkPlatformCollision(mario, mp);
      }
      
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        
        if (enemy.update()) {
          enemies.splice(i, 1);
          continue;
        }
        
        for (const platform of platforms) {
          if (enemy.checkCollision && !enemy.squish) {
            if (enemy.x < platform.x + platform.width &&
                enemy.x + enemy.width > platform.x &&
                enemy.y < platform.y + platform.height &&
                enemy.y + enemy.height > platform.y &&
                enemy.vy >= 0) {
              enemy.y = platform.y - enemy.height;
              enemy.vy = 0;
            }
          }
        }
        
        if (!enemy.squish && !enemy.shell && 
            enemy.y + enemy.height > mario.y + mario.height - 8 &&
            enemy.y + enemy.height < mario.y + mario.height &&
            mario.x < enemy.x + enemy.width &&
            mario.x + mario.width > enemy.x &&
            mario.vy > 0) {
          enemy.stomp();
        } else if (!enemy.squish && !enemy.shell &&
                   mario.x < enemy.x + enemy.width - 5 &&
                   mario.x + mario.width > enemy.x + 5 &&
                   mario.y < enemy.y + enemy.height &&
                   mario.y + mario.height > enemy.y + 5) {
          if (mario.invincible) {
            enemy.stomp();
          } else {
            mario.hit();
          }
        } else if (enemy.shell && enemy.shellMoving &&
                   mario.x < enemy.x + enemy.width &&
                   mario.x + mario.width > enemy.x &&
                   mario.y < enemy.y + enemy.height &&
                   mario.y + mario.height > enemy.y) {
          if (mario.invincible) {
            enemy.stomp();
          } else {
            mario.hit();
          }
        }
      }
      
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        
        if (pu.update()) {
          powerUps.splice(i, 1);
          continue;
        }
        
        if (pu.active &&
            mario.x < pu.x + pu.width &&
            mario.x + mario.width > pu.x &&
            mario.y < pu.y + pu.height &&
            mario.y + mario.height > pu.y) {
          
          if (pu.type === 'star') mario.powerUp('star');
          else if (pu.type === 'fireflower') mario.powerUp('fireflower');
          else mario.powerUp('mushroom');
          
          powerUps.splice(i, 1);
        }
      }
      
      for (let i = coinObjects.length - 1; i >= 0; i--) {
        const coin = coinObjects[i];
        
        if (coin.update()) {
          coinObjects.splice(i, 1);
          continue;
        }
        
        if (!coin.collected &&
            mario.x < coin.x + coin.width &&
            mario.x + mario.width > coin.x &&
            mario.y < coin.y + coin.height &&
            mario.y + mario.height > coin.y) {
          coin.collect();
        }
      }
      
      for (let i = 0; i < platforms.length; i++) {
        const platform = platforms[i];
        if (platform.type === 'question') {
          if (mario.x + mario.width > platform.x &&
              mario.x < platform.x + platform.width &&
              mario.y + mario.height > platform.y &&
              mario.y < platform.y + platform.height &&
              mario.vy < 0) {
            mario.y = platform.y + platform.height;
            mario.vy = 2;
            
            platform.hitAnim = 20;
            playSound('coin');
            createParticles(platform.x + platform.width / 2, platform.y, COLORS.coin, 10);
            
            let found = false;
            for (const coin of coinObjects) {
              if (!coin.collected && 
                  Math.abs(coin.x - platform.x) < 50 &&
                  Math.abs(coin.y - platform.y) < 100) {
                coin.collect();
                found = true;
                break;
              }
            }
            
            if (!found) {
              const types = ['mushroom', 'fireflower', 'star'];
              const type = types[Math.floor(Math.random() * types.length)];
              powerUps.push(new PowerUp(platform.x, platform.y - 8, type));
            }
          }
        }
      }
      
      if (mario.y > 700) mario.die();
      
      if (flagPole.checkWin(mario)) {
        score += Math.floor(time) * 50;
        time = 0;
        stopTimer();
        playSound('levelcomplete');
        
        if (!badges.firstLevel) {
          badges.firstLevel = true;
          localStorage.setItem('marioBadges', JSON.stringify(badges));
          floatingTexts.push(new FloatingText(mario.x, mario.y - 50, 'BADGE: FIRST LEVEL!', COLORS.neonGreen, 20));
        }
        
        gameState = GameState.LEVEL_COMPLETE;
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].update()) particles.splice(i, 1);
      }
      
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        if (floatingTexts[i].update()) floatingTexts.splice(i, 1);
      }
    }
    
    function draw() {
      ctx.save();
      
      if (screenShake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * screenShake,
          (Math.random() - 0.5) * screenShake
        );
      }
      
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      if (gameState === GameState.TITLE || gameState === GameState.LOADING) {
        drawTitleScreen();
        ctx.restore();
        return;
      }
      
      drawBackground();
      
      for (const platform of platforms) platform.draw();
      for (const mp of movingPlatforms) mp.draw();
      
      castle.draw();
      flagPole.draw();
      
      for (const coin of coinObjects) coin.draw();
      for (const pu of powerUps) pu.draw();
      for (const enemy of enemies) enemy.draw();
      
      mario.draw();
      
      for (const particle of particles) particle.draw();
      for (const ft of floatingTexts) ft.draw();
      
      drawHUD();
      
      if (gameState === GameState.GAME_OVER) drawGameOver();
      else if (gameState === GameState.LEVEL_COMPLETE) drawLevelComplete();
      else if (gameState === GameState.WORLD_COMPLETE) drawWorldComplete();
      
      ctx.restore();
    }
    
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        keys.jump = true;
        e.preventDefault();
      }
      if (e.code === 'KeyM') isMuted = !isMuted;
      
      if (e.code === 'KeyR') {
        if (gameState === GameState.GAME_OVER || gameState === GameState.WORLD_COMPLETE) {
          score = 0; coins = 0; lives = 3; currentLevel = 1; time = 400; xp = 0; levelXP = 0;
          loadLevel(currentLevel);
          gameState = GameState.PLAYING;
          startTimer();
        }
      }
      
      if (e.code === 'Space') {
        if (gameState === GameState.TITLE) {
          initAudio();
          gameState = GameState.PLAYING;
          loadLevel(currentLevel);
          startTimer();
        } else if (gameState === GameState.LEVEL_COMPLETE) {
          currentLevel++;
          if (currentLevel > 4) {
            if (!badges.allLevels) {
              badges.allLevels = true;
              localStorage.setItem('marioBadges', JSON.stringify(badges));
            }
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('marioHighScoreCodedex', highScore);
            }
            gameState = GameState.WORLD_COMPLETE;
          } else {
            time = 400;
            score += 5000;
            levelXP = 0;
            loadLevel(currentLevel);
            gameState = GameState.PLAYING;
            startTimer();
          }
        }
      }
    });
    
    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
    });
    
    function init() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 25;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          setTimeout(() => {
            loadingOverlay.classList.add('hidden');
            gameState = GameState.TITLE;
          }, 600);
        }
        loadingProgress.style.width = progress + '%';
      }, 80);
      
      gameLoop();
    }
    
    init();
  </script>
</body>
</html>
