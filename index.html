<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario - Premium Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
    }
    
    #gameContainer {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        0 0 60px rgba(255, 215, 0, 0.3),
        0 0 120px rgba(255, 100, 50, 0.2),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
      border: 4px solid #333;
    }
    
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    
    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-text {
      color: #FFD700;
      font-size: 24px;
      margin-bottom: 30px;
      text-shadow: 0 0 20px #FFD700;
      animation: pulse 1s ease-in-out infinite;
    }
    
    .loading-bar {
      width: 300px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #FFD700;
    }
    
    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #FF6B00, #FFD700, #FF6B00);
      background-size: 200% 100%;
      animation: loading 2s linear infinite;
      width: 0%;
      transition: width 0.3s ease;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    #controls {
      position: absolute;
      bottom: -50px;
      left: 0;
      right: 0;
      text-align: center;
      color: #888;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
    <div id="loadingOverlay">
      <div class="loading-text">SUPER MARIO</div>
      <div class="loading-bar">
        <div class="loading-progress" id="loadingProgress"></div>
      </div>
    </div>
    <div id="controls">ARROWS/WASD: MOVE | SPACE: JUMP | R: RESTART | M: MUTE</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const loadingProgress = document.getElementById('loadingProgress');
    const loadingOverlay = document.getElementById('loadingOverlay');
    
    const TILE_SIZE = 32;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -14;
    const MOVE_SPEED = 6;
    const FRICTION = 0.82;
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 640;
    
    const GameState = {
      LOADING: 'loading',
      TITLE: 'title',
      PLAYING: 'playing',
      PAUSED: 'paused',
      GAME_OVER: 'gameover',
      LEVEL_COMPLETE: 'levelcomplete',
      WORLD_COMPLETE: 'worldcomplete'
    };
    
    let gameState = GameState.LOADING;
    let currentLevel = 1;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('marioHighScore')) || 0;
    let coins = 0;
    let lives = 3;
    let time = 400;
    let timerInterval = null;
    let cameraX = 0;
    let cameraY = 0;
    let frameCount = 0;
    let screenShake = 0;
    let particles = [];
    let floatingTexts = [];
    let isMuted = false;
    let levelWidth = 3200;
    let levelHeight = 640;
    
    const keys = { left: false, right: false, jump: false, jumpPressed: false };
    
    const COLORS = {
      sky1: '#1a1a2e', sky2: '#16213e', sky3: '#0f3460',
      ground: '#8B4513', brick: '#C84C0C', brickLight: '#E06800', brickDark: '#9A3D08',
      marioRed: '#E52521', marioSkin: '#FFB8A0', marioBrown: '#6B4423',
      goomba: '#8B6914', goombaDark: '#5D4612',
      coin: '#FFD700', coinDark: '#DAA520',
      pipe: '#00A800', pipeDark: '#006600', pipeHighlight: '#32CD32',
      flagPole: '#228B22', flagBall: '#FF0000',
      questionBlock: '#FFB800', questionDark: '#CC9000', questionHighlight: '#FFE44D',
      cloud: '#FFFFFF', bush: '#228B22', bushDark: '#1a6b1a',
      lava: '#FF4500', lavaDark: '#8B0000', lavaLight: '#FF6B35',
      ice: '#87CEEB', iceDark: '#4682B4', iceLight: '#E0FFFF',
      castle: '#8B7355', castleDark: '#5D4E37', castleLight: '#A89078',
      star: '#FFFF00', starGlow: '#FFD700',
      powerup: '#FF1493', powerupGlow: '#FF69B4',
      mushBlue: '#00BFFF', mushRed: '#FF6347',
      fire: '#FF4500', fireGlow: '#FF6347'
    };
    
    const LEVEL_THEMES = {
      1: { sky: ['#1a1a2e', '#16213e', '#0f3460'], ground: '#8B4513', name: 'WORLD 1-1' },
      2: { sky: ['#2d1b4e', '#1a0a2e', '#0d0615'], ground: '#4a3728', name: 'WORLD 1-2' },
      3: { sky: ['#1a3a4a', '#0d2d3d', '#052030'], ground: '#3d5c5c', name: 'WORLD 1-3' },
      4: { sky: ['#4a1a1a', '#3d0d0d', '#2a0505'], ground: '#5c3d3d', name: 'WORLD 1-4' }
    };
    
    class Particle {
      constructor(x, y, color, options = {}) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = options.vx || (Math.random() - 0.5) * 10;
        this.vy = options.vy || (Math.random() - 0.5) * 10 - 3;
        this.life = options.life || 40;
        this.maxLife = this.life;
        this.size = options.size || Math.random() * 8 + 3;
        this.gravity = options.gravity !== undefined ? options.gravity : 0.2;
        this.fade = options.fade !== undefined ? options.fade : true;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.3;
        this.type = options.type || 'square';
      }
      
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.98;
        this.life--;
        this.rotation += this.rotationSpeed;
        return this.life <= 0;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        const alpha = this.fade ? this.life / this.maxLife : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(screenX, this.y);
        ctx.rotate(this.rotation);
        
        if (this.type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
        } else if (this.type === 'star') {
          this.drawStar(0, 0, 5, this.size, this.size / 2, this.color);
        } else {
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        }
        
        ctx.restore();
      }
      
      drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
        let rot = Math.PI / 2 * 3;
        let step = Math.PI / spikes;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        
        for (let i = 0; i < spikes; i++) {
          ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
          rot += step;
        }
        
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
      }
    }
    
    class FloatingText {
      constructor(x, y, text, color = '#FFD700') {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 60;
        this.maxLife = 60;
        this.scale = 0;
      }
      
      update() {
        this.y -= 1.5;
        this.life--;
        this.scale = Math.min(1, this.scale + 0.15);
        return this.life <= 0;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
        
        const alpha = Math.min(1, this.life / 20);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = `${Math.floor(16 * this.scale)}px "Press Start 2P", monospace`;
        ctx.textAlign = 'center';
        
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, screenX, this.y);
        
        ctx.restore();
      }
    }
    
    class Mario {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 32;
        this.vx = 0;
        this.vy = 0;
        this.onGround = false;
        this.facingRight = true;
        this.frame = 0;
        this.frameTimer = 0;
        this.state = 'small';
        this.invincible = false;
        this.invincibleTimer = 0;
        this.isJumping = false;
        this.isRunning = false;
        this.tailFrame = 0;
        this.fireTimer = 0;
        this.maxJumps = 1;
        this.jumpsLeft = this.maxJumps;
      }
      
      update() {
        if (keys.left) {
          this.vx -= 0.8;
          this.facingRight = false;
          this.isRunning = true;
        } else if (keys.right) {
          this.vx += 0.8;
          this.facingRight = true;
          this.isRunning = true;
        } else {
          this.isRunning = false;
        }
        
        this.vx *= FRICTION;
        this.vx = Math.max(-MOVE_SPEED, Math.min(MOVE_SPEED, this.vx));
        
        if (Math.abs(this.vx) < 0.1) this.vx = 0;
        
        if (keys.jump && !keys.jumpPressed && this.jumpsLeft > 0) {
          this.vy = JUMP_FORCE;
          this.jumpsLeft--;
          this.isJumping = true;
          keys.jumpPressed = true;
          playSound('jump');
          this.createJumpParticles();
        }
        
        if (!keys.jump) {
          keys.jumpPressed = false;
          if (this.vy < -5) this.vy = -5;
        }
        
        if (this.onGround) {
          this.jumpsLeft = this.maxJumps;
          this.isJumping = false;
        }
        
        this.vy += GRAVITY;
        this.vy = Math.min(18, this.vy);
        
        this.x += this.vx;
        this.y += this.vy;
        
        if (this.x < 0) this.x = 0;
        if (this.x > levelWidth - this.width) this.x = levelWidth - this.width;
        if (this.y > levelHeight + 100) this.die();
        
        this.frameTimer++;
        if (this.frameTimer > 6) {
          this.frameTimer = 0;
          this.frame = (this.frame + 1) % 4;
        }
        
        if (this.invincible) {
          this.invincibleTimer--;
          if (this.invincibleTimer <= 0) this.invincible = false;
        }
        
        if (this.state === 'fire' && frameCount % 30 === 0) {
          this.fireTimer++;
        }
        
        this.onGround = false;
      }
      
      createJumpParticles() {
        for (let i = 0; i < 8; i++) {
          particles.push(new Particle(
            this.x + this.width / 2,
            this.y + this.height,
            '#FFFFFF',
            { vx: (Math.random() - 0.5) * 6, vy: Math.random() * -3, size: Math.random() * 4 + 2 }
          ));
        }
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        if (this.invincible && frameCount % 4 < 2) return;
        
        ctx.save();
        
        let drawX = screenX;
        if (!this.facingRight) {
          ctx.translate(screenX + this.width, 0);
          ctx.scale(-1, 1);
          drawX = 0;
        }
        
        if (this.isJumping) {
          this.drawJumpingMario(drawX);
        } else if (this.isRunning && Math.abs(this.vx) > 1) {
          this.drawRunningMario(drawX);
        } else {
          this.drawIdleMario(drawX);
        }
        
        ctx.restore();
        
        if (this.state === 'fire') {
          this.drawFireAura(screenX);
        }
      }
      
      drawIdleMario(x) {
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 8, this.y + 2, 12, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 6, this.y, 16, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, this.y + 2, 3, 3);
        ctx.fillRect(x + 18, this.y + 2, 3, 3);
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 10, this.y + 6, 8, 2);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 6, this.y + 10, 16, 10);
        
        ctx.fillStyle = '#FFEB3B';
        ctx.fillRect(x + 8, this.y + 12, 12, 6);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 4, this.y + 18, 8, 14);
        ctx.fillRect(x + 16, this.y + 18, 8, 14);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 2, this.y + 18, 4, 8);
        ctx.fillRect(x + 22, this.y + 18, 4, 8);
        
        if (this.state !== 'small') {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 4, this.y + 18, 8, 4);
          ctx.fillRect(x + 16, this.y + 18, 8, 4);
        }
      }
      
      drawRunningMario(x) {
        const frameOffset = this.frame % 2 === 0 ? 0 : 2;
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 8, this.y + 2 - frameOffset, 12, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 6, this.y - frameOffset, 16, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, this.y + 2 - frameOffset, 3, 3);
        ctx.fillRect(x + 18, this.y + 2 - frameOffset, 3, 3);
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 10, this.y + 6 - frameOffset, 8, 2);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 6, this.y + 10 - frameOffset, 16, 10);
        
        ctx.fillStyle = '#FFEB3B';
        ctx.fillRect(x + 8, this.y + 12 - frameOffset, 12, 6);
        
        if (this.frame === 0) {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 2, this.y + 18, 8, 10);
          ctx.fillRect(x + 18, this.y + 22, 8, 10);
          ctx.fillStyle = COLORS.marioBrown;
          ctx.fillRect(x + 4, this.y + 26, 4, 6);
          ctx.fillRect(x + 20, this.y + 30, 4, 4);
        } else if (this.frame === 1) {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 4, this.y + 20, 8, 12);
          ctx.fillRect(x + 16, this.y + 20, 8, 12);
          ctx.fillStyle = COLORS.marioBrown;
          ctx.fillRect(x + 6, this.y + 30, 4, 4);
          ctx.fillRect(x + 18, this.y + 30, 4, 4);
        } else {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 6, this.y + 18, 8, 10);
          ctx.fillRect(x + 14, this.y + 18, 8, 10);
          ctx.fillStyle = COLORS.marioBrown;
          ctx.fillRect(x + 2, this.y + 26, 4, 6);
          ctx.fillRect(x + 22, this.y + 26, 4, 6);
        }
        
        if (this.state !== 'small') {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 4, this.y + 18, 8, 4);
          ctx.fillRect(x + 16, this.y + 18, 8, 4);
        }
      }
      
      drawJumpingMario(x) {
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 8, this.y + 2, 12, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 6, this.y, 16, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, this.y + 2, 3, 3);
        ctx.fillRect(x + 18, this.y + 2, 3, 3);
        
        ctx.fillStyle = COLORS.marioSkin;
        ctx.fillRect(x + 10, this.y + 6, 8, 2);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 6, this.y + 10, 16, 10);
        
        ctx.fillStyle = '#FFEB3B';
        ctx.fillRect(x + 8, this.y + 12, 12, 6);
        
        ctx.fillStyle = COLORS.marioRed;
        ctx.fillRect(x + 2, this.y + 18, 8, 8);
        ctx.fillRect(x + 18, this.y + 18, 8, 8);
        
        ctx.fillStyle = COLORS.marioBrown;
        ctx.fillRect(x + 0, this.y + 20, 4, 8);
        ctx.fillRect(x + 24, this.y + 20, 4, 8);
        
        if (this.state !== 'small') {
          ctx.fillStyle = COLORS.marioRed;
          ctx.fillRect(x + 2, this.y + 18, 8, 4);
          ctx.fillRect(x + 18, this.y + 18, 8, 4);
        }
      }
      
      drawFireAura(screenX) {
        const flicker = Math.sin(frameCount * 0.3) * 3;
        
        ctx.save();
        ctx.globalAlpha = 0.3;
        const gradient = ctx.createRadialGradient(
          screenX + this.width / 2, this.y + this.height / 2, 5,
          screenX + this.width / 2, this.y + this.height / 2, 40 + flicker
        );
        gradient.addColorStop(0, '#FF4500');
        gradient.addColorStop(0.5, '#FF6B35');
        gradient.addColorStop(1, 'transparent');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(screenX + this.width / 2, this.y + this.height / 2, 40 + flicker, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      
      hit() {
        if (this.invincible) return;
        
        if (this.state === 'small') {
          this.die();
        } else {
          this.state = 'small';
          this.height = 32;
          this.invincible = true;
          this.invincibleTimer = 120;
          playSound('shrink');
          screenShake = 10;
        }
      }
      
      powerUp(type) {
        if (type === 'mushroom') {
          this.state = 'big';
          this.height = 48;
        } else if (type === 'fireflower') {
          this.state = 'fire';
          this.height = 48;
        } else if (type === 'star') {
          this.invincible = true;
          this.invincibleTimer = 600;
          playSound('powerup');
        }
        
        if (this.state !== 'small') {
          this.y -= 16;
        }
        
        playSound('powerup');
        floatingTexts.push(new FloatingText(this.x, this.y - 20, 'POWER UP!', '#00FF00'));
      }
      
      die() {
        lives--;
        playSound('death');
        screenShake = 20;
        
        if (lives <= 0) {
          gameState = GameState.GAME_OVER;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('marioHighScore', highScore);
          }
          stopTimer();
        } else {
          this.x = 100;
          this.y = 400;
          this.vx = 0;
          this.vy = 0;
          this.state = 'small';
          this.height = 32;
          this.invincible = true;
          this.invincibleTimer = 180;
          cameraX = 0;
        }
      }
    }
    
    class Goomba {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.vx = -1.5;
        this.alive = true;
        this.deadTimer = 0;
        this.squish = false;
        this.walkFrame = 0;
        this.walkTimer = 0;
      }
      
      update() {
        if (this.squish) {
          this.deadTimer++;
          return this.deadTimer > 45;
        }
        
        if (this.x < cameraX - 150 || this.x > cameraX + CANVAS_WIDTH + 150) return false;
        
        this.x += this.vx;
        this.walkTimer++;
        if (this.walkTimer > 8) {
          this.walkTimer = 0;
          this.walkFrame = (this.walkFrame + 1) % 2;
        }
        
        for (const platform of platforms) {
          if (this.checkCollision(platform) && this.vy >= 0) {
            this.x -= this.vx;
            this.vx *= -1;
          }
        }
        
        return false;
      }
      
      checkCollision(rect) {
        return this.x < rect.x + rect.width &&
               this.x + this.width > rect.x &&
               this.y < rect.y + rect.height &&
               this.y + this.height > rect.y;
      }
      
      stomp() {
        this.squish = true;
        this.vx = 0;
        score += 100;
        playSound('stomp');
        createParticles(this.x + this.width / 2, this.y + this.height / 2, COLORS.goomba, 10);
        floatingTexts.push(new FloatingText(this.x, this.y, '+100'));
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        if (this.squish) {
          ctx.fillStyle = COLORS.goombaDark;
          ctx.fillRect(screenX + 5, this.y + 22, 20, 8);
          return;
        }
        
        ctx.fillStyle = COLORS.goomba;
        ctx.beginPath();
        ctx.arc(screenX + 15, this.y + 12, 13, Math.PI, 0, false);
        ctx.fill();
        
        ctx.fillRect(screenX + 2, this.y + 12, 26, 12);
        
        ctx.fillStyle = '#000';
        ctx.fillRect(screenX + 5, this.y + 6, 6, 8);
        ctx.fillRect(screenX + 19, this.y + 6, 6, 8);
        
        ctx.fillStyle = '#FFF';
        ctx.fillRect(screenX + 7, this.y + 8, 2, 3);
        ctx.fillRect(screenX + 21, this.y + 8, 2, 3);
        
        const footOffset = this.walkFrame === 0 ? 0 : 2;
        ctx.fillStyle = COLORS.goombaDark;
        ctx.fillRect(screenX + 2, this.y + 20 + footOffset, 6, 10 - footOffset);
        ctx.fillRect(screenX + 22, this.y + 20 + (2 - footOffset), 6, 10 - (2 - footOffset));
      }
    }
    
    class Koopa {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 36;
        this.vx = -1;
        this.alive = true;
        this.squish = false;
        this.shell = false;
        this.shellMoving = false;
        this.facingRight = false;
      }
      
      update() {
        if (this.squish) return false;
        
        if (this.shell && !this.shellMoving) return false;
        
        if (!this.shell || this.shellMoving) {
          this.x += this.vx;
        }
        
        if (this.x < cameraX - 150 || this.x > cameraX + CANVAS_WIDTH + 150) return false;
        
        for (const platform of platforms) {
          if (this.checkCollision(platform)) {
            this.x -= this.vx;
            this.vx *= -1;
            this.facingRight = this.vx > 0;
          }
        }
        
        return false;
      }
      
      checkCollision(rect) {
        return this.x < rect.x + rect.width &&
               this.x + this.width > rect.x &&
               this.y < rect.y + rect.height &&
               this.y + this.height > rect.y;
      }
      
      stomp() {
        if (this.shell && !this.shellMoving) {
          this.shellMoving = true;
          this.vx = mario.facingRight ? 8 : -8;
          playSound('kick');
        } else if (this.shell) {
          this.shellMoving = false;
          this.vx = 0;
        } else {
          this.shell = true;
          this.height = 20;
          this.vx = 0;
          playSound('stomp');
        }
        score += 100;
        createParticles(this.x + this.width / 2, this.y + this.height / 2, '#00FF00', 8);
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        ctx.save();
        
        if (this.shell) {
          ctx.fillStyle = '#00AA00';
          ctx.beginPath();
          ctx.ellipse(screenX + 14, this.y + 10, 12, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#008800';
          ctx.beginPath();
          ctx.ellipse(screenX + 14, this.y + 10, 8, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#FFEB3B';
          ctx.beginPath();
          ctx.ellipse(screenX + 14, this.y + 10, 3, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#00AA00';
          ctx.beginPath();
          ctx.arc(screenX + 14, this.y + 10, 12, Math.PI, 0, false);
          ctx.fill();
          
          ctx.fillRect(screenX + 2, this.y + 10, 24, 16);
          
          ctx.fillStyle = '#FFEB3B';
          ctx.beginPath();
          ctx.arc(screenX + 6, this.y + 14, 4, 0, Math.PI * 2);
          ctx.arc(screenX + 22, this.y + 14, 4, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(screenX + 6, this.y + 14, 2, 0, Math.PI * 2);
          ctx.arc(screenX + 22, this.y + 14, 2, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#00AA00';
          ctx.fillRect(screenX + 2, this.y + 24, 6, 12);
          ctx.fillRect(screenX + 20, this.y + 24, 6, 12);
        }
        
        ctx.restore();
      }
    }

    class PowerUp {
      constructor(x, y, type = 'mushroom') {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 28;
        this.vx = type === 'mushroom' ? 1.5 : 3;
        this.vy = 0;
        this.type = type;
        this.emergeY = y;
        this.emerging = true;
        this.active = false;
      }
      
      update() {
        if (this.emerging) {
          this.y -= 1;
          if (this.y <= this.emergeY - TILE_SIZE) {
            this.emerging = false;
            this.active = true;
          }
          return false;
        }
        
        this.vy += GRAVITY;
        this.y += this.vy;
        this.x += this.vx;
        
        for (const platform of platforms) {
          if (this.checkCollision(platform) && this.vy >= 0) {
            this.y = platform.y - this.height;
            this.vy = 0;
          }
        }
        
        if (this.x < cameraX - 100 || this.x > cameraX + CANVAS_WIDTH + 100) return false;
        
        if (this.x < 0) this.x = 0;
        if (this.x > levelWidth - this.width) {
          this.x = levelWidth - this.width;
          this.vx *= -1;
        }
        
        return false;
      }
      
      checkCollision(rect) {
        return this.x < rect.x + rect.width &&
               this.x + this.width > rect.x &&
               this.y < rect.y + rect.height &&
               this.y + this.height > rect.y;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;
        
        ctx.save();
        
        if (this.type === 'mushroom') {
          ctx.shadowBlur = 20;
          ctx.shadowColor = COLORS.mushRed;
          
          ctx.fillStyle = '#FF6347';
          ctx.beginPath();
          ctx.arc(screenX + 14, this.y + 10, 12, Math.PI, 0, false);
          ctx.fill();
          
          ctx.fillStyle = '#FFF';
          ctx.beginPath();
          ctx.arc(screenX + 8, this.y + 6, 4, 0, Math.PI * 2);
          ctx.arc(screenX + 20, this.y + 6, 4, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = COLORS.mushRed;
          ctx.fillRect(screenX + 4, this.y + 14, 20, 14);
          
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(screenX + 10, this.y + 18, 8, 10);
        } else if (this.type === 'fireflower') {
          ctx.shadowBlur = 25;
          ctx.shadowColor = COLORS.fire;
          
          const pulse = Math.sin(frameCount * 0.2) * 2;
          
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2 + frameCount * 0.05;
            const petalX = screenX + 14 + Math.cos(angle) * (8 + pulse);
            const petalY = this.y + 14 + Math.sin(angle) * (8 + pulse);
            
            const gradient = ctx.createRadialGradient(petalX, petalY, 0, petalX, petalY, 8);
            gradient.addColorStop(0, '#FFFF00');
            gradient.addColorStop(0.5, '#FF6B00');
            gradient.addColorStop(1, '#FF4500');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(petalX, petalY, 7, 0, Math.PI * 2);
            ctx.fill();
          }
          
          ctx.fillStyle = '#8B0000';
          ctx.beginPath();
          ctx.arc(screenX + 14, this.y + 14, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'star') {
          ctx.shadowBlur = 30;
          ctx.shadowColor = COLORS.star;
          
          const pulse = Math.sin(frameCount * 0.3) * 3;
          
          ctx.save();
          ctx.translate(screenX + 14, this.y + 14);
          ctx.rotate(frameCount * 0.1);
          
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 14 + pulse);
          gradient.addColorStop(0, '#FFFFFF');
          gradient.addColorStop(0.3, '#FFFF00');
          gradient.addColorStop(0.7, '#FFD700');
          gradient.addColorStop(1, '#FFA500');
          
          ctx.fillStyle = gradient;
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
            const r = i % 2 === 0 ? 14 + pulse : 6;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
          }
          ctx.closePath();
          ctx.fill();
          
          ctx.restore();
        }
        
        ctx.restore();
      }
    }
    
    class Platform {
      constructor(x, y, width, height, type = 'brick') {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.type = type;
        this.hitAnim = 0;
        this.decoration = Math.random();
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
        
        const theme = LEVEL_THEMES[currentLevel] || LEVEL_THEMES[1];
        
        if (this.type === 'pipe') {
          this.drawPipe(screenX, theme);
        } else if (this.type === 'ground') {
          this.drawGround(screenX, theme);
        } else if (this.type === 'question') {
          this.drawQuestionBlock(screenX);
        } else if (this.type === 'brick') {
          this.drawBrick(screenX);
        } else if (this.type === 'stone') {
          this.drawStone(screenX);
        }
      }
      
      drawPipe(screenX, theme) {
        const segments = Math.ceil(this.height / TILE_SIZE);
        const topWidth = TILE_SIZE * 2.5;
        const lipHeight = TILE_SIZE / 2;
        
        ctx.fillStyle = COLORS.pipeDark;
        ctx.fillRect(screenX, this.y + lipHeight, topWidth, this.height);
        
        ctx.fillStyle = COLORS.pipe;
        ctx.fillRect(screenX + 4, this.y + lipHeight, topWidth - 8, this.height);
        
        ctx.fillStyle = COLORS.pipeHighlight;
        ctx.fillRect(screenX + 8, this.y + lipHeight, 8, this.height);
        
        ctx.fillStyle = COLORS.pipeDark;
        ctx.fillRect(screenX - 8, this.y, topWidth + 16, lipHeight);
        
        ctx.fillStyle = COLORS.pipe;
        ctx.fillRect(screenX - 4, this.y, topWidth + 8, lipHeight);
        
        ctx.fillStyle = COLORS.pipeHighlight;
        ctx.fillRect(screenX, this.y, topWidth, lipHeight / 2);
      }
      
      drawGround(screenX, theme) {
        ctx.fillStyle = theme.ground;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        for (let x = 0; x < this.width; x += TILE_SIZE) {
          for (let y = 0; y < this.height; y += TILE_SIZE / 2) {
            const offset = (Math.floor(y / (TILE_SIZE / 2)) % 2) * (TILE_SIZE / 2);
            
            ctx.fillStyle = COLORS.brick;
            ctx.fillRect(screenX + x + offset + 1, this.y + y + 1, TILE_SIZE - 2, TILE_SIZE / 2 - 2);
            
            ctx.fillStyle = COLORS.brickLight;
            ctx.fillRect(screenX + x + offset + 2, this.y + y + 2, TILE_SIZE - 4, 3);
          }
        }
        
        ctx.fillStyle = COLORS.brickDark;
        ctx.fillRect(screenX, this.y, this.width, 4);
      }
      
      drawQuestionBlock(screenX) {
        const bounce = this.hitAnim > 0 ? Math.sin(this.hitAnim * 0.5) * 3 : 0;
        
        ctx.save();
        ctx.translate(0, bounce);
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = COLORS.questionBlock;
        
        const gradient = ctx.createLinearGradient(screenX, this.y, screenX, this.y + this.height);
        gradient.addColorStop(0, COLORS.questionHighlight);
        gradient.addColorStop(0.3, COLORS.questionBlock);
        gradient.addColorStop(1, COLORS.questionDark);
        
        ctx.fillStyle = gradient;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = COLORS.questionDark;
        ctx.fillRect(screenX, this.y, this.width, 4);
        ctx.fillRect(screenX, this.y + this.height - 4, this.width, 4);
        ctx.fillRect(screenX, this.y, 4, this.height);
        ctx.fillRect(screenX + this.width - 4, this.y, 4, this.height);
        
        ctx.fillStyle = '#FF6B00';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('?', screenX + this.width / 2, this.y + this.height / 2 + 7);
        
        ctx.restore();
        
        if (this.hitAnim > 0) this.hitAnim--;
      }
      
      drawBrick(screenX) {
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        
        ctx.fillStyle = COLORS.brick;
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = COLORS.brickLight;
        ctx.fillRect(screenX + 2, this.y + 2, this.width - 4, 4);
        ctx.fillRect(screenX + 2, this.y + this.height / 2 - 2, this.width - 4, 4);
        
        ctx.fillStyle = COLORS.brickDark;
        ctx.fillRect(screenX + 2, this.y + 2, 2, this.height - 4);
        ctx.fillRect(screenX + this.width / 2 - 1, this.y + 2, 2, this.height - 4);
        ctx.fillRect(screenX + this.width - 4, this.y + 2, 2, this.height - 4);
        
        ctx.fillRect(screenX, this.y + this.height / 2 - 1, this.width, 2);
        
        ctx.shadowBlur = 0;
      }
      
      drawStone(screenX) {
        ctx.fillStyle = '#808080';
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = '#A0A0A0';
        ctx.fillRect(screenX + 2, this.y + 2, this.width - 4, 4);
        
        ctx.fillStyle = '#606060';
        ctx.fillRect(screenX + 2, this.y + 2, 2, this.height - 4);
        ctx.fillRect(screenX + this.width - 4, this.y + 2, 2, this.height - 4);
      }
    }

    class MovingPlatform {
      constructor(x, y, width, height, moveX, moveY, speed = 2) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.moveX = moveX;
        this.moveY = moveY;
        this.speed = speed;
        this.progress = 0;
        this.forward = true;
      }
      
      update() {
        if (this.forward) {
          this.progress += this.speed / 100;
          if (this.progress >= 1) {
            this.progress = 1;
            this.forward = false;
          }
        } else {
          this.progress -= this.speed / 100;
          if (this.progress <= 0) {
            this.progress = 0;
            this.forward = true;
          }
        }
        
        this.x = this.startX + this.moveX * this.progress;
        this.y = this.startY + this.moveY * this.progress;
      }
      
      draw() {
        const screenX = this.x - cameraX;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) return;
        
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(screenX, this.y, this.width, this.height);
        
        ctx.fillStyle = COLORS.brickLight;
        ctx.fillRect(screenX + 4, this.y + 4, this.width - 8, 4);
        
        ctx.fillStyle = '#FF6B00';
        ctx.fillRect(screenX, this.y, this.width, 6);
      }
    }

    function checkPlatformCollision(entity, platform) {
      const wasAbove = entity.y + entity.height - entity.vy <= platform.y + 5;
      const isOverlapping = entity.x < platform.x + platform.width &&
                            entity.x + entity.width > platform.x &&
                            entity.y < platform.y + platform.height &&
                            entity.y + entity.height > platform.y;
      
      if (isOverlapping && wasAbove && entity.vy >= 0) {
        entity.y = platform.y - entity.height;
        entity.vy = 0;
        entity.onGround = true;
        return true;
      }
      
      return false;
    }
    
    let audioCtx = null;
    
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    
    function playSound(type) {
      if (!audioCtx || isMuted) return;
      
      try {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        switch(type) {
          case 'jump':
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.08);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            oscillator.start(now);
            oscillator.stop(now + 0.12);
            break;
            
          case 'coin':
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(988, now);
            oscillator.frequency.setValueAtTime(1319, now + 0.05);
            oscillator.frequency.setValueAtTime(1760, now + 0.1);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            oscillator.start(now);
            oscillator.stop(now + 0.2);
            break;
            
          case 'stomp':
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(300, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            oscillator.start(now);
            oscillator.stop(now + 0.1);
            break;
            
          case 'kick':
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(200, now);
            oscillator.frequency.exponentialRampToValueAtTime(80, now + 0.15);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            oscillator.start(now);
            oscillator.stop(now + 0.15);
            break;
            
          case 'powerup':
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523, now);
            oscillator.frequency.setValueAtTime(659, now + 0.1);
            oscillator.frequency.setValueAtTime(784, now + 0.2);
            oscillator.frequency.setValueAtTime(1047, now + 0.3);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            oscillator.start(now);
            oscillator.stop(now + 0.4);
            break;
            
          case 'shrink':
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.3);
            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            oscillator.start(now);
            oscillator.stop(now + 0.3);
            break;
            
          case 'death':
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(80, now + 0.8);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            oscillator.start(now);
            oscillator.stop(now + 0.8);
            break;
            
          case 'levelcomplete':
            const notes = [523, 659, 784, 1047, 784, 1047, 1319];
            notes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, now + i * 0.15);
              gain.gain.setValueAtTime(0.1, now + i * 0.15);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.2);
              osc.start(now + i * 0.15);
              osc.stop(now + i * 0.15 + 0.2);
            });
            break;
        }
      } catch(e) {}
    }
    
    function drawBackground() {
      const theme = LEVEL_THEMES[currentLevel] || LEVEL_THEMES[1];
      
      const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      gradient.addColorStop(0, theme.sky[0]);
      gradient.addColorStop(0.5, theme.sky[1]);
      gradient.addColorStop(1, theme.sky[2]);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      for (const mountain of mountains) {
        const screenX = mountain.x - cameraX * 0.1;
        if (screenX < -200 || screenX > CANVAS_WIDTH + 200) continue;
        
        ctx.fillStyle = theme.sky[2];
        ctx.beginPath();
        ctx.moveTo(screenX - 100 * mountain.size, 576);
        ctx.lineTo(screenX, 576 - 200 * mountain.size);
        ctx.lineTo(screenX + 100 * mountain.size, 576);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = theme.sky[1];
        ctx.beginPath();
        ctx.moveTo(screenX - 60 * mountain.size, 576);
        ctx.lineTo(screenX, 576 - 150 * mountain.size);
        ctx.lineTo(screenX + 60 * mountain.size, 576);
        ctx.closePath();
        ctx.fill();
      }
      
      for (const hill of hills) {
        const screenX = hill.x - cameraX * 0.3;
        if (screenX < -150 || screenX > CANVAS_WIDTH + 150) continue;
        
        ctx.fillStyle = '#1a5c1a';
        ctx.beginPath();
        ctx.arc(screenX, 576, 80 * hill.size, Math.PI, 0, false);
        ctx.fill();
        
        ctx.fillStyle = '#228B22';
        ctx.beginPath();
        ctx.arc(screenX, 576, 60 * hill.size, Math.PI, 0, false);
        ctx.fill();
      }
      
      for (const cloud of clouds) {
        const screenX = cloud.x - cameraX * 0.2;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) continue;
        
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#FFFFFF';
        ctx.translate(screenX, cloud.y);
        ctx.scale(cloud.size, cloud.size);
        
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.arc(35, -8, 35, 0, Math.PI * 2);
        ctx.arc(70, 0, 25, 0, Math.PI * 2);
        ctx.arc(20, 12, 22, 0, Math.PI * 2);
        ctx.arc(50, 12, 22, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
      
      ctx.fillStyle = theme.ground;
      for (const bush of bushes) {
        const screenX = bush.x - cameraX * 0.5;
        if (screenX < -100 || screenX > CANVAS_WIDTH + 100) continue;
        
        ctx.fillStyle = COLORS.bushDark;
        ctx.beginPath();
        ctx.arc(screenX, 550, 55 * bush.size, Math.PI, 0, false);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(screenX + 50, 550, 45 * bush.size, Math.PI, 0, false);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(screenX + 90, 550, 50 * bush.size, Math.PI, 0, false);
        ctx.fill();
        
        ctx.fillStyle = COLORS.bush;
        ctx.beginPath();
        ctx.arc(screenX, 550, 45 * bush.size, Math.PI, 0, false);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(screenX + 50, 550, 35 * bush.size, Math.PI, 0, false);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(screenX + 90, 550, 40 * bush.size, Math.PI, 0, false);
        ctx.fill();
      }
    }

    function drawMiniMario(x, y) {
      ctx.fillStyle = COLORS.marioRed;
      ctx.fillRect(x + 2, y, 10, 8);
      ctx.fillStyle = COLORS.marioSkin;
      ctx.fillRect(x + 4, y - 2, 6, 4);
      ctx.fillStyle = COLORS.marioBrown;
      ctx.fillRect(x, y + 6, 4, 4);
      ctx.fillRect(x + 10, y + 6, 4, 4);
    }
    
    function drawTitleScreen() {
      const theme = LEVEL_THEMES[1];
      
      const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      gradient.addColorStop(0, '#0a0a0a');
      gradient.addColorStop(0.5, '#1a1a2e');
      gradient.addColorStop(1, '#0a0a0a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      ctx.fillStyle = '#1a3a5c';
      for (let i = 0; i < 50; i++) {
        const x = (i * 50 + frameCount * 0.5) % CANVAS_WIDTH;
        const y = Math.sin(i) * 50 + 100;
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      
      ctx.shadowBlur = 40;
      ctx.shadowColor = '#FFD700';
      ctx.fillStyle = '#E52521';
      ctx.font = '48px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SUPER MARIO', CANVAS_WIDTH / 2, 180);
      
      ctx.shadowColor = '#FFD700';
      ctx.fillStyle = '#FFD700';
      ctx.font = '24px "Press Start 2P", monospace';
      ctx.fillText('PREMIUM EDITION', CANVAS_WIDTH / 2, 230);
      
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.fillText('4 WORLDS  |  POWER-UPS  |  INFINITE FUN', CANVAS_WIDTH / 2, 280);
      
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = '16px "Press Start 2P", monospace';
        ctx.fillText('PRESS SPACE TO START', CANVAS_WIDTH / 2, 400);
      }
      
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#888';
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText('ARROWS/WASD: MOVE  |  SPACE: JUMP  |  M: MUTE', CANVAS_WIDTH / 2, 520);
      ctx.fillText('HIGH SCORE: ' + highScore, CANVAS_WIDTH / 2, 550);
      
      ctx.textAlign = 'left';
      
      drawMarioPreview(CANVAS_WIDTH / 2 - 14, 310);
    }
    
    function drawMarioPreview(x, y) {
      ctx.fillStyle = COLORS.marioSkin;
      ctx.fillRect(x + 8, y + 2, 12, 8);
      
      ctx.fillStyle = COLORS.marioBrown;
      ctx.fillRect(x + 6, y, 16, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 8, y + 2, 3, 3);
      ctx.fillRect(x + 18, y + 2, 3, 3);
      
      ctx.fillStyle = COLORS.marioRed;
      ctx.fillRect(x + 6, y + 10, 16, 10);
      ctx.fillRect(x + 4, y + 18, 8, 14);
      ctx.fillRect(x + 16, y + 18, 8, 14);
      
      ctx.fillStyle = COLORS.marioBrown;
      ctx.fillRect(x + 2, y + 18, 4, 8);
      ctx.fillRect(x + 22, y + 18, 4, 8);
    }
    
    function drawGameOver() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#FF0000';
      ctx.fillStyle = '#E52521';
      ctx.font = '48px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, 250);
      
      ctx.shadowColor = '#FFD700';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '20px "Press Start 2P", monospace';
      ctx.fillText(`FINAL SCORE: ${score}`, CANVAS_WIDTH / 2, 330);
      ctx.fillText(`COINS: ${coins}`, CANVAS_WIDTH / 2, 370);
      
      if (score >= highScore && score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.fillText('NEW HIGH SCORE!', CANVAS_WIDTH / 2, 410);
      }
      
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '14px "Press Start 2P", monospace';
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillText('PRESS R TO RESTART', CANVAS_WIDTH / 2, 500);
      }
      
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
    }
    
    function drawLevelComplete() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      ctx.shadowBlur = 40;
      ctx.shadowColor = '#00FF00';
      ctx.fillStyle = '#00FF00';
      ctx.font = '36px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL COMPLETE!', CANVAS_WIDTH / 2, 220);
      
      ctx.shadowColor = '#FFD700';
      ctx.fillStyle = '#FFD700';
      ctx.font = '20px "Press Start 2P", monospace';
      ctx.fillText(`SCORE: ${score}`, CANVAS_WIDTH / 2, 300);
      ctx.fillText(`TIME BONUS: ${Math.floor(time) * 50}`, CANVAS_WIDTH / 2, 340);
      
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '14px "Press Start 2P", monospace';
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillText('PRESS SPACE FOR NEXT LEVEL', CANVAS_WIDTH / 2, 450);
      }
      
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
    }
    
    function drawWorldComplete() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      for (let i = 0; i < 20; i++) {
        const x = Math.sin(frameCount * 0.05 + i) * 400 + CANVAS_WIDTH / 2;
        const y = Math.cos(frameCount * 0.05 + i * 0.5) * 200 + CANVAS_HEIGHT / 2;
        ctx.fillStyle = ['#FFD700', '#FF6347', '#00FF00', '#00BFFF'][i % 4];
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(x, y, 5 + Math.sin(frameCount * 0.1 + i) * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      
      ctx.shadowBlur = 50;
      ctx.shadowColor = '#FFD700';
      ctx.fillStyle = '#FFD700';
      ctx.font = '48px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('CONGRATULATIONS!', CANVAS_WIDTH / 2, 200);
      
      ctx.shadowColor = '#00FF00';
      ctx.fillStyle = '#00FF00';
      ctx.font = '28px "Press Start 2P", monospace';
      ctx.fillText('WORLD COMPLETE!', CANVAS_WIDTH / 2, 260);
      
      ctx.shadowColor = '#FFD700';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '20px "Press Start 2P", monospace';
      ctx.fillText(`FINAL SCORE: ${score}`, CANVAS_WIDTH / 2, 340);
      ctx.fillText(`TOTAL COINS: ${coins}`, CANVAS_WIDTH / 2, 380);
      
      if (score >= highScore) {
        ctx.fillStyle = '#FFD700';
        ctx.fillText('NEW HIGH SCORE!', CANVAS_WIDTH / 2, 430);
      }
      
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '14px "Press Start 2P", monospace';
      if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillText('PRESS R TO PLAY AGAIN', CANVAS_WIDTH / 2, 520);
      }
      
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';
    }
    
    function startTimer() {
      stopTimer();
      timerInterval = setInterval(() => {
        if (gameState === GameState.PLAYING) {
          time--;
          if (time <= 0) {
            time = 0;
            mario.die();
          }
        }
      }, 1000);
    }
    
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    function update() {
      frameCount++;
      
      if (screenShake > 0) screenShake--;
      
      if (gameState !== GameState.PLAYING) return;
      
      mario.update();
      
      const targetCameraX = mario.x - CANVAS_WIDTH / 3;
      cameraX += (targetCameraX - cameraX) * 0.1;
      cameraX = Math.max(0, Math.min(levelWidth - CANVAS_WIDTH, cameraX));
      
      for (const platform of platforms) {
        checkPlatformCollision(mario, platform);
      }
      
      for (const mp of movingPlatforms) {
        mp.update();
        checkPlatformCollision(mario, mp);
      }
      
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        
        if (enemy.update()) {
          enemies.splice(i, 1);
          continue;
        }
        
        for (const platform of platforms) {
          if (enemy.checkCollision && !enemy.squish) {
            if (enemy.x < platform.x + platform.width &&
                enemy.x + enemy.width > platform.x &&
                enemy.y < platform.y + platform.height &&
                enemy.y + enemy.height > platform.y &&
                enemy.vy >= 0) {
              enemy.y = platform.y - enemy.height;
              enemy.vy = 0;
            }
          }
        }
        
        for (const mp of movingPlatforms) {
          if (enemy.checkCollision && !enemy.squish) {
            if (enemy.x < mp.x + mp.width &&
                enemy.x + enemy.width > mp.x &&
                enemy.y < mp.y + mp.height &&
                enemy.y + enemy.height > mp.y) {
              enemy.x += mp.x - mp.startX > 0 ? 2 : -2;
            }
          }
        }
        
        if (!enemy.squish && !enemy.shell && 
            enemy.y + enemy.height > mario.y + mario.height - 8 &&
            enemy.y + enemy.height < mario.y + mario.height &&
            mario.x < enemy.x + enemy.width &&
            mario.x + mario.width > enemy.x &&
            mario.vy > 0) {
          enemy.stomp();
        } else if (!enemy.squish && !enemy.shell &&
                   mario.x < enemy.x + enemy.width - 5 &&
                   mario.x + mario.width > enemy.x + 5 &&
                   mario.y < enemy.y + enemy.height &&
                   mario.y + mario.height > enemy.y + 5) {
          if (mario.invincible) {
            enemy.stomp();
          } else {
            mario.hit();
          }
        } else if (enemy.shell && enemy.shellMoving &&
                   mario.x < enemy.x + enemy.width &&
                   mario.x + mario.width > enemy.x &&
                   mario.y < enemy.y + enemy.height &&
                   mario.y + mario.height > enemy.y) {
          if (mario.invincible) {
            enemy.stomp();
          } else {
            mario.hit();
          }
        }
      }
      
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        
        if (pu.update()) {
          powerUps.splice(i, 1);
          continue;
        }
        
        if (pu.active &&
            mario.x < pu.x + pu.width &&
            mario.x + mario.width > pu.x &&
            mario.y < pu.y + pu.height &&
            mario.y + mario.height > pu.y) {
          
          if (pu.type === 'star') {
            mario.powerUp('star');
          } else if (pu.type === 'fireflower') {
            mario.powerUp('fireflower');
          } else {
            mario.powerUp('mushroom');
          }
          
          powerUps.splice(i, 1);
        }
      }
      
      for (let i = coinObjects.length - 1; i >= 0; i--) {
        const coin = coinObjects[i];
        
        if (coin.update()) {
          coinObjects.splice(i, 1);
          continue;
        }
        
        if (!coin.collected &&
            mario.x < coin.x + coin.width &&
            mario.x + mario.width > coin.x &&
            mario.y < coin.y + coin.height &&
            mario.y + mario.height > coin.y) {
          coin.collect();
        }
      }
      
      for (let i = 0; i < platforms.length; i++) {
        const platform = platforms[i];
        if (platform.type === 'question') {
          if (mario.x + mario.width > platform.x &&
              mario.x < platform.x + platform.width &&
              mario.y + mario.height > platform.y &&
              mario.y < platform.y + platform.height &&
              mario.vy < 0) {
            mario.y = platform.y + platform.height;
            mario.vy = 2;
            
            platform.hitAnim = 20;
            
            playSound('coin');
            createParticles(platform.x + platform.width / 2, platform.y, COLORS.coin, 8);
            
            let found = false;
            for (const coin of coinObjects) {
              if (!coin.collected && 
                  Math.abs(coin.x - platform.x) < 50 &&
                  Math.abs(coin.y - platform.y) < 100) {
                coin.collect();
                found = true;
                break;
              }
            }
            
            if (!found) {
              const types = ['mushroom', 'fireflower', 'star'];
              const type = types[Math.floor(Math.random() * types.length)];
              powerUps.push(new PowerUp(platform.x, platform.y - 8, type));
            }
          }
        }
      }
      
      if (mario.y > levelHeight + 100) {
        mario.die();
      }
      
      if (flagPole.checkWin(mario)) {
        score += Math.floor(time) * 50;
        time = 0;
        stopTimer();
        playSound('levelcomplete');
        gameState = GameState.LEVEL_COMPLETE;
      }
      
      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].update()) {
          particles.splice(i, 1);
        }
      }
      
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        if (floatingTexts[i].update()) {
          floatingTexts.splice(i, 1);
        }
      }
    }
    
    function draw() {
      ctx.save();
      
      if (screenShake > 0) {
        ctx.translate(
          (Math.random() - 0.5) * screenShake,
          (Math.random() - 0.5) * screenShake
        );
      }
      
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      
      if (gameState === GameState.TITLE || gameState === GameState.LOADING) {
        drawTitleScreen();
        ctx.restore();
        return;
      }
      
      drawBackground();
      
      for (const platform of platforms) {
        platform.draw();
      }
      
      for (const mp of movingPlatforms) {
        mp.draw();
      }
      
      castle.draw();
      flagPole.draw();
      
      for (const coin of coinObjects) {
        coin.draw();
      }
      
      for (const pu of powerUps) {
        pu.draw();
      }
      
      for (const enemy of enemies) {
        enemy.draw();
      }
      
      mario.draw();
      
      for (const particle of particles) {
        particle.draw();
      }
      
      for (const ft of floatingTexts) {
        ft.draw();
      }
      
      drawHUD();
      
      if (gameState === GameState.GAME_OVER) {
        drawGameOver();
      } else if (gameState === GameState.LEVEL_COMPLETE) {
        drawLevelComplete();
      } else if (gameState === GameState.WORLD_COMPLETE) {
        drawWorldComplete();
      }
      
      ctx.restore();
    }
    
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        keys.jump = true;
        e.preventDefault();
      }
      if (e.code === 'KeyM') {
        isMuted = !isMuted;
      }
      if (e.code === 'KeyR') {
        if (gameState === GameState.GAME_OVER || gameState === GameState.WORLD_COMPLETE) {
          score = 0;
          coins = 0;
          lives = 3;
          currentLevel = 1;
          time = 400;
          loadLevel(currentLevel);
          gameState = GameState.PLAYING;
          startTimer();
        }
      }
      if (e.code === 'Space') {
        if (gameState === GameState.TITLE) {
          initAudio();
          gameState = GameState.PLAYING;
          loadLevel(currentLevel);
          startTimer();
        } else if (gameState === GameState.LEVEL_COMPLETE) {
          currentLevel++;
          if (currentLevel > 4) {
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('marioHighScore', highScore);
            }
            gameState = GameState.WORLD_COMPLETE;
          } else {
            time = 400;
            score += 5000;
            loadLevel(currentLevel);
            gameState = GameState.PLAYING;
            startTimer();
          }
        }
      }
    });
    
    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
    });
    
    function init() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 20;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          
          setTimeout(() => {
            loadingOverlay.classList.add('hidden');
            gameState = GameState.TITLE;
          }, 500);
        }
        loadingProgress.style.width = progress + '%';
      }, 100);
      
      gameLoop();
    }
    
    init();
  </script>
</body>
</html>
